<div class="profile-menu">
  <!-- Avatar que abre o cierra la tarjeta dinámica del perfil. -->
  <button
    class="profile-menu__trigger"
    type="button"
    aria-label="Abrir menú de perfil"
    [attr.aria-expanded]="isOpen()"
    (click)="toggleMenu()"
  >
    <span class="profile-menu__trigger-avatar" [class.profile-menu__trigger-avatar--guest]="selectedRole() === 'Invitado'">
      {{ currentProfile().initials }}
    </span>
  </button>

  @if (isOpen()) {
    <!-- Tarjeta única cuyo contenido cambia según el rol seleccionado. -->
    <section class="profile-menu__card" aria-label="Menú de perfil">
      <!-- Datos del perfil actual y avatar correspondiente al rol. -->
      <div class="profile-menu__summary">
        <div class="profile-menu__avatar" [class.profile-menu__avatar--guest]="selectedRole() === 'Invitado'">
          {{ currentProfile().initials }}
        </div>
        <div class="profile-menu__identity">
          <strong>{{ currentProfile().name }}</strong>
          @if (currentProfile().email) {
            <span>{{ currentProfile().email }}</span>
          }
          <span>ROL: {{ currentProfile().role }}</span>
        </div>
      </div>

      <!-- Selector temporal que actualiza el estado del perfil en tiempo real. -->
      <label class="profile-menu__role-label" for="profile-role">ROL</label>
      <select
        id="profile-role"
        class="profile-menu__role-select"
        [value]="selectedRole()"
        (change)="selectRole($event)"
      >
        <option value="Invitado">Invitado</option>
        <option value="Usuario">Usuario</option>
        <option value="Administrador">Administrador</option>
      </select>

      <!-- Acciones condicionadas al rol actual del perfil. -->
      <div class="profile-menu__actions">
        @if (selectedRole() === 'Invitado') {
          <!-- Acciones disponibles para el estado invitado. -->
          <button type="button" (click)="goToLogin()">Iniciar sesión</button>
          <button type="button" (click)="goToRegister()">Registrarse</button>
        } @else {
          <!-- Acciones disponibles para usuarios registrados. -->
          <button type="button" (click)="requestProfile()">Ver perfil</button>
          @if (selectedRole() === 'Administrador') {
            <!-- Administración visible únicamente para el rol administrador. -->
            <button type="button" (click)="requestAdministration()">Administración</button>
          }
          <button type="button" (click)="signOut()">Cerrar sesión</button>
        }
      </div>
    </section>
  }
</div>
