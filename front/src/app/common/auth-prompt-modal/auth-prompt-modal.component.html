@if (authPrompt.isOpen()) {
  <div class="auth-prompt-backdrop" (click)="authPrompt.close()">
    <div class="auth-prompt-dialog" (click)="$event.stopPropagation()">
      <button type="button" class="close-x-btn" (click)="authPrompt.close()" aria-label="Cerrar ventana">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>

      <div class="prompt-icon-badge">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
          <line x1="9" y1="10" x2="15" y2="10"></line>
          <line x1="12" y1="7" x2="12" y2="13"></line>
        </svg>
      </div>

      <h3 class="prompt-title">{{ authPrompt.title() }}</h3>
      <p class="prompt-message">{{ authPrompt.message() }}</p>

      <div class="prompt-actions">
        <button type="button" class="btn-primary" (click)="authPrompt.goToLogin()">
          Iniciar Sesión
        </button>
        <button type="button" class="btn-secondary" (click)="authPrompt.goToRegister()">
          Registrarme
        </button>
      </div>

      <button type="button" class="btn-text-dismiss" (click)="authPrompt.close()">
        Cerrar y seguir leyendo
      </button>
    </div>
  </div>
}
