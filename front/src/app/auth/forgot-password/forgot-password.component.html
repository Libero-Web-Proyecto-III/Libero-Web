<div class="auth-container">
  <a routerLink="/auth/login" class="back-btn">Volver al inicio de sesión</a>
  <div class="auth-card">
    <div class="auth-header">
      <div class="brand-badge">Líbero Cobre</div>
      <h1 class="auth-title">Recupera tu contraseña</h1>
      <p class="auth-subtitle">Te enviaremos un enlace al correo asociado a tu cuenta.</p>
    </div>

    <div *ngIf="successMessage" class="alert alert-success">{{ successMessage }}</div>
    <div *ngIf="errorMessage" class="alert alert-danger">{{ errorMessage }}</div>

    <form [formGroup]="form" (ngSubmit)="submit()" class="auth-form" novalidate>
      <div class="form-group">
        <label for="reset-email" class="form-label">Correo electrónico</label>
        <input id="reset-email" type="email" formControlName="email" placeholder="nombre@ejemplo.com" class="form-input" />
        <div *ngIf="form.controls.email.invalid && form.controls.email.touched" class="field-error">
          Ingresa un correo electrónico válido.
        </div>
      </div>
      <button type="submit" class="submit-btn" [disabled]="isLoading">
        {{ isLoading ? 'Enviando...' : 'Enviar enlace' }}
      </button>
    </form>
  </div>
</div>
