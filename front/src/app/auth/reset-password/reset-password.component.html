<div class="auth-container">
  <a routerLink="/auth/login" class="back-btn">Volver al inicio de sesión</a>
  <div class="auth-card">
    <div class="auth-header">
      <div class="brand-badge">Líbero Cobre</div>
      <h1 class="auth-title">Nueva contraseña</h1>
      <p class="auth-subtitle">Crea una contraseña de al menos 8 caracteres.</p>
    </div>

    <div *ngIf="errorMessage" class="alert alert-danger">{{ errorMessage }}</div>
    <form [formGroup]="form" (ngSubmit)="submit()" class="auth-form" novalidate>
      <div class="form-group">
        <label for="new-password" class="form-label">Nueva contraseña</label>
        <input id="new-password" type="password" formControlName="password" class="form-input" autocomplete="new-password" />
        <div *ngIf="form.controls.password.invalid && form.controls.password.touched" class="field-error">Usa entre 8 y 50 caracteres.</div>
      </div>
      <div class="form-group">
        <label for="confirmation" class="form-label">Confirmar contraseña</label>
        <input id="confirmation" type="password" formControlName="confirmation" class="form-input" autocomplete="new-password" />
        <div *ngIf="form.controls.confirmation.errors?.['mismatch'] && form.controls.confirmation.touched" class="field-error">Las contraseñas no coinciden.</div>
      </div>
      <button type="submit" class="submit-btn" [disabled]="isLoading">{{ isLoading ? 'Guardando...' : 'Cambiar contraseña' }}</button>
    </form>
  </div>
</div>
